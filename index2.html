       <div class="gallery-item"><img src="img\2025-11-01_08.18.11.png" alt=""></div>
    </section>
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button type="button" class="lightbox-close" aria-label="Закрыть">&times;</button>
      <img class="lightbox-img" src="" alt="">
    </div>
    <script>
      (function () {
        var root = document.getElementById("lightbox");
        var full = root.querySelector(".lightbox-img");
        var btn = root.querySelector(".lightbox-close");

        function open(src, alt) {
          full.src = src;
          full.alt = alt || "";
          root.classList.add("is-open");
          root.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function close() {
          root.classList.remove("is-open");
          root.setAttribute("aria-hidden", "true");
          full.removeAttribute("src");
          full.alt = "";
          document.body.style.overflow = "";
        }

        document.querySelector(".gallery").addEventListener("click", function (e) {
          var t = e.target;
          if (t.tagName !== "IMG") return;
          open(t.currentSrc || t.src, t.alt);
        });

        btn.addEventListener("click", close);
        root.addEventListener("click", function (e) {
          if (e.target === root) close();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && root.classList.contains("is-open")) close();
        });
      })();
    </script>
  </body>
</html>
